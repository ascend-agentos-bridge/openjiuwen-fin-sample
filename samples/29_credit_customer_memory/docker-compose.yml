# 样例 29 · Agent Memory 服务 + Java Agent Core 应用
# 用法：
#   export LLM_API_KEY=sk-...                         # DeepSeek / OpenAI 兼容
#   export EMBEDDER_BASE_URL=http://host.docker.internal:1234/v1
#   docker compose up -d --build
#   ./scripts/start-agent-memory.sh                   # 打印 Agent Memory Web（Portal）地址
name: openjiuwen-credit-memory

services:
  agent-memory:
    build:
      context: ./memory-service
      dockerfile: Dockerfile
      args:
        AGENT_MEMORY_REF: 2a77650c16f8fe073d8713bc91fc703a7233359d
    container_name: ojw29-agent-memory
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?请先 export LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      EMBEDDER_BASE_URL: ${EMBEDDER_BASE_URL:-http://host.docker.internal:1234/v1}
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDER_API_KEY: ${EMBEDDER_API_KEY:-lm-studio}
    ports:
      - "127.0.0.1:8137:8137"
    volumes:
      - ./memory-service/config.yml:/config/config.yml:ro
      - agent-memory-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8138/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Agent Memory 的 dev auth 只允许绑定 127.0.0.1；容器内用 socat 暴露到共享网络命名空间的 8137。
  agent-memory-proxy:
    image: alpine/socat:latest
    container_name: ojw29-agent-memory-proxy
    network_mode: "service:agent-memory"
    command: TCP-LISTEN:8137,fork,reuseaddr TCP:127.0.0.1:8138
    depends_on:
      agent-memory:
        condition: service_healthy
    restart: unless-stopped



volumes:
  agent-memory-data:
